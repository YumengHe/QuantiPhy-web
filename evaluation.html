<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="site.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<nav class="topbar" aria-label="Site"><div class="topbar-in"><a href="index.html">Home</a><a href="pipeline.html">Pipeline</a><a href="evaluation.html" aria-current="page">Evaluation</a><a href="baseline.html">Baseline</a><a href="versions.html">Versions</a></div></nav>
<main class="wrap">
<h1>Evaluation</h1>

<div id="pane-val">
  <div class="panel">
    <div class="stats">
      <div class="m"><div class="muted" id="val-label"></div><div class="big" id="val-head">…</div></div>
      <div id="val-first" class="m" hidden><div class="muted" id="val-first-label"></div><div class="big" id="val-first-head"></div></div>
    </div>
    <div class="muted" id="val-n"></div>
  </div>
  <div class="controls">
    <label>Set <select id="v-set"><option value="dev" selected>DEV20</option><option value="">All</option></select></label>
    <label>Source <select id="v-src"><option value="">All</option><option>scene</option><option>measurement</option><option>prior</option><option>unresolved</option><option value="execution_failed">failed</option></select></label>
    <label>Video source <select id="v-vsrc"><option value="">All</option></select></label>
    <label>MRA <select id="v-mra"><option value="">All</option><option value="lt0.2">&lt; 0.2</option><option value="lt0.5">&lt; 0.5</option><option value="ge0.8">≥ 0.8</option></select></label>
    <label>Sort <select id="v-sort"><option value="" selected>Set order</option><option value="mra-asc">MRA ascending</option><option value="mra-desc">MRA descending</option></select></label>
    <label><input type="search" id="v-q" placeholder="ID or question"></label>
  </div>
  <div class="status" id="v-status"></div>
  <div id="val-list"></div>
</div>

</main>
<script src="videos.js"></script>
</body>
</html>
