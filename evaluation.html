<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="site.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<nav class="topbar" aria-label="Site" data-i18n-aria-label><div class="topbar-in"><a href="index.html" data-i18n>Home</a><a href="pipeline.html" data-i18n>Pipeline</a><a href="evaluation.html" aria-current="page" data-i18n>Evaluation</a><a href="baseline.html" data-i18n>Baseline</a><a href="wild.html" data-i18n>In the Wild</a></div></nav>
<main class="wrap">
<h1 data-i18n>Evaluation</h1>

<div id="pane-val">
  <div class="panel">
    <div class="stats">
      <div class="m"><div class="muted">answer_final</div><div class="big" id="val-final">…</div></div>
      <div class="m"><div class="muted">answer_scene</div><div class="big" id="val-scene"></div></div>
    </div>
    <div class="muted" id="val-n"></div>
    <div class="sptables">
      <div class="scroll-x"><table id="t-sets"></table></div>
      <div class="scroll-x"><table id="t-cats"></table></div>
      <div class="scroll-x"><table id="t-src"></table></div>
      <div class="scroll-x"><table id="t-loop"></table></div>
    </div>
  </div>
  <div class="controls">
    <label><span data-i18n>Set</span> <select id="v-set"><option value="" selected data-i18n>All</option><option value="dev">DEV20</option></select></label>
    <label><span data-i18n>Source</span> <select id="v-src"><option value="" data-i18n>All</option><option>scene</option><option>agent</option><option>none</option></select></label>
    <label><span data-i18n>Video source</span> <select id="v-vsrc"><option value="" data-i18n>All</option></select></label>
    <label>MRA <select id="v-mra"><option value="" data-i18n>All</option><option value="lt0.2">&lt; 0.2</option><option value="lt0.5">&lt; 0.5</option><option value="ge0.8">≥ 0.8</option></select></label>
    <label><span data-i18n>Sort</span> <select id="v-sort"><option value="" selected data-i18n>Set order</option><option value="mra-asc" data-i18n>answer_final MRA ascending</option><option value="mra-desc" data-i18n>answer_final MRA descending</option><option value="smra-asc" data-i18n>answer_scene MRA ascending</option><option value="smra-desc" data-i18n>answer_scene MRA descending</option></select></label>
    <label><input type="search" id="v-q" placeholder="ID or question" data-i18n-placeholder></label>
  </div>
  <div class="status" id="v-status"></div>
  <div id="val-list"></div>
</div>

</main>
<script src="i18n.js"></script>
<script src="videos.js"></script>
</body>
</html>
